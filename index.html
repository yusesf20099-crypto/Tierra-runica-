*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

 set('hp',P.hp,maxHp(),'Vida '+Math.ceil(P.hp)+'/'+maxHp());if(P.c==='g')set('mp',P.mp,maxMp(),'Maná '+Math.floor(P.mp)+'/'+maxMp());set('xp',P.xp,need(P.lv),'XP '+P.xp+'/'+need(P.lv));
